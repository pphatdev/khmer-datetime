name: Publish to JSR

on:
  push:
    tags:
      - "v*" # Trigger when you push a tag like v0.1.0

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token: authenticates with JSR and signs provenance
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno publish
